# Publishes the five games (public/*.html) with a game picker (pages/index.html)
# to GitHub Pages, so anyone can play them offline in the browser.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
name: Deploy games to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'public/*.html'
      - 'pages/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp public/*.html _site/
          cp pages/index.html _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
